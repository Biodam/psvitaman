name: Build PSVitaman VPK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Check Quota & Visibility Safeguard
        run: |
          echo "=========================================="
          echo "Checking GitHub Actions Quota Safeguards..."
          echo "=========================================="
          IS_PRIVATE="${{ github.event.repository.private }}"
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::Repository is PRIVATE! Builds consume billable Actions minutes."
            if [ "${{ secrets.ALLOW_PRIVATE_BUILDS }}" != "true" ] && [ "${{ vars.ALLOW_PRIVATE_BUILDS }}" != "true" ]; then
              echo "::error::Build aborted by quota safeguard! Set repository to PUBLIC or configure ALLOW_PRIVATE_BUILDS=true."
              exit 1
            fi
          else
            echo "Repository is PUBLIC -> GitHub Actions minutes are 100% FREE and UNLIMITED."
            echo "Quota safeguard: PASSED (Zero billing cost)."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          vdpm install mbedtls || true
          mkdir -p build
          cd build
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cmake -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake -DGIT_COMMIT_HASH="${SHORT_SHA}" ..

      - name: Build PSVitaman.vpk
        run: |
          cd build
          make -j$(nproc)

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaman-vpk
          path: build/PSVitaman.vpk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PSVitaman.vpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
