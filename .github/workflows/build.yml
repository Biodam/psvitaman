name: Build PSVitaman VPK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          echo "=== curl-config ==="
          curl-config --libs || true
          echo "=== arm-vita-eabi curl-config ==="
          ${VITASDK}/bin/arm-vita-eabi-curl-config --libs || true
          echo "=== pkg-config ==="
          pkg-config --libs libcurl || true
          echo "=== Installed libraries in VITASDK ==="
          ls -la ${VITASDK}/arm-vita-eabi/lib/libcurl* ${VITASDK}/arm-vita-eabi/lib/libssl* ${VITASDK}/arm-vita-eabi/lib/libcrypto* ${VITASDK}/arm-vita-eabi/lib/libmbed* || true
          echo "=== Checking symbols in libssl.a ==="
          arm-vita-eabi-nm ${VITASDK}/arm-vita-eabi/lib/libssl.a | grep -i SSL_library_init || true
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake ..

      - name: Build PSVitaman.vpk
        run: |
          cd build
          make -j$(nproc)

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaman-vpk
          path: build/PSVitaman.vpk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PSVitaman.vpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
